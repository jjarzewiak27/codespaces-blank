<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub-A-Dog | Booking</title>
    <link rel="stylesheet" href="stylesheets/styles.css">
</head>
<body>

<header class="site-header">

    <div class="header-top">
        <div class="logo-box">
            <h1>Scrub-A-Dog</h1>
            <p>Clean Pets. Clean Owners.</p>
        </div>

        <nav id="main-nav">
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="booking.html">Booking</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </div>

    <div class="dog-banner">
        <img src="images/dog-banner.jpg" alt="Row of dogs">
    </div>

</header>

<main>
    <div class="booking-wrapper">
        <h2>Contact us to book your appointment.</h2>

        <form action="#" method="post">
            <div class="booking-form">

                <!-- LEFT FIELDSET: CUSTOMER INFORMATION -->
                <fieldset>
                    <legend>Customer Information</legend>

                    <label for="first-name">First Name:</label>
                    <input type="text" id="first-name" name="first-name" required>

                    <label for="last-name">Last Name:</label>
                    <input type="text" id="last-name" name="last-name" required>

                    <label for="pet-name">Pet's Name:</label>
                    <input type="text" id="pet-name" name="pet-name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">

                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date">
                </fieldset>

                <!-- RIGHT FIELDSET: SERVICE REQUEST -->
                <fieldset>
                    <legend>Service Request</legend>

                    <p>I would like the following service:</p>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="service" value="basic" checked>
                            Basic Groom
                        </label>
                        <label>
                            <input type="radio" name="service" value="full">
                            Full Groom
                        </label>
                        <label>
                            <input type="radio" name="service" value="pampered">
                            Pampered Groom
                        </label>
                    </div>

                    <label for="groomer">Preferred Groomer</label>
                    <select id="groomer" name="groomer">
                        <option value="none">No preference</option>
                        <option value="Groomer 1">John</option>
                        <option value="Groomer 2">Sydney</option>
                        <option value="Groomer 3">Jose</option>
                        <option value="Groomer 4">Pablo</option>
                    </select>

                    <label for="requests">Special requests or instructions</label>
                    <textarea id="requests" name="requests" rows="4"></textarea>
                </fieldset>

            </div>

            <div class="booking-submit">
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>
</main>


<footer class="site-footer">
    <p>© Copyright 2024. All Rights Reserved.</p>
    <p><a href="mailto:contact@polipaws.net">contact@polipaws.net</a></p>
</footer>

<script src="script.js"></script>

</body>
</html>
